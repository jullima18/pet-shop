<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema de gerenciamento de Pet Shop Dashboard</title>
</head>
<body>
<h1 id="boas Vindas">Dashboard Bem-vindo!</h1>
<button id="btnLogout">Sair</button>
<script>
const usuarioSalvo= localStorage.getItem('usuarioLogado');
// Se não houver usuário Logado ou for um valor inválido, volte para o login
if (!usuarioSalvo || usuarioSalvo =='undefined') {
window.location.href='index.html';
} else {
const usuarioDados= JSON.parse(usuarioSalvo);
document.getElementById('boasVindas').innerText = 'Dashboard Bem-vindo, ${usuarioDados.email}!';
}
// Função do botão Sair
document.getElementById('btnLogout').addEventListener('click', ()=> {
LocalStorage.removeItem('usuarioLogado');
window.location.href='index.html';
});
</script>
</body>
</html>,
